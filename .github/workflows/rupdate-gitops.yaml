name: "Update and gitops manifest"

on:
  workflow_dispatch:
    inputs:
      services:
        description: "Path to the service to deploy (go/api-golang)"
        required: true
        type: choice
        options:
          - services/go/api-golang
          - services/node/api-node
          - services/other/api-golang-migrator
          - services/python/load-generator-python
          - services/react/client-react
      version:
        description: "Version to deploy"
        required: true
        type: string
      environment:
        description: "Target environment to deploy to"
        required: true
        type: choice
        options:
          - development
          - staging
          - production

concurrency:
  group: ${{github.workflow}}-gitops-${{inputs.environment}}-${{inputs.services}}
  cancel-in-progress: false

jobs:
  update-manifests:
    runs-on: ubuntu-24.04
    environment: ${{ inputs.environment }}
    permissions:
      contents: write
    steps:
      - name: checkout code
        uses: actions/checkout@d632683dd7b4114ad314bca15554477dd762a938

      - name: Install task
        uses: ./.github/ractions/setup-dependencies

      - name: Generate Commit Message
        id: generate-commit-message
        run: |
          commit_message="chore : update ${{inputs.environment}} , ${{inputs.services}} , ${{inputs.version}} [skip ci]"
          echo "commit_message=${commit_message}" >> $GITHUB_OUTPUT
          echo $commit_message

      - name: Update manifests
        working-directory: ${{ inputs.services }}
        run: |
          echo "${{ inputs.services }}"
          task utils:update-image-tags-service \
              NEW_TAG=${{ inputs.version }} \
              ENVIRONMENT=${{ inputs.environment }}

      - name: check diff
        run: |
          git --no-pager diff

      - name: commmit and push (via task)
        if: ${{ !env.act }}
        run: |
          task utils:git:commit-push \
              COMMIT_MSG = "${{ steps.generate-commit-message.outputs.commit_message}}" \
              BRANCH = main
