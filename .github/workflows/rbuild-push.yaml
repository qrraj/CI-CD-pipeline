name: Build and Push Container Images

on:
  push:
    branches:
      - main
    paths:
      - services/**
    tags:
      - "**@[0-9]*.[0-9]*.[0-9]*"
  workflow_dispatch:
    inputs:
      services:
        description: "Service to build"
        type: choice
        required: true
        options:
          - /services/node/api-node
          - /services/go/api-golang
          - /services/other/api-golang-migrator
          - /services/python/load-generator-python
          - /services/react/client-react

      version:
        description: "Version/tag to use"
        required: false
        type: string

jobs:
  filters:
    runs-on: ubuntu-24.04
    outputs:
      services: ${{steps.set-output.outputs.services}}
      environment: ${{steps.set-output.outputs.environment}}
    steps:
      - name: checkout code
        uses: actions/checkout@d632683dd7b4114ad314bca15554477dd762a938

      - name: filter
        id: filter
        uses: dorny/paths-filter@de90cc6fb38fc0963ad72b210f1f284cd68cea36
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          filters: .github/rutils/file-filters.yaml

      - name: Set Output
        id: set-output
        env:
          CHANGES: ${{steps.filter.outputs.changes}}
        run: |
          if [[ "${{ github.event_name }}" == 'workflow_dispatch' ]]; then
            echo 'services=["${{ inputs.services }}"]' >> "$GITHUB_OUTPUT"
            echo "environment=deployment" >> "$GITHUB_OUTPUT"
          elif [[ "${{ github.ref_type }}" == 'tag' ]]; then 
            tag="${GITHUB_REF_NAME}"
            svc="${tag%%@*}"
            echo "services=[\"$svc\"]" >> "$GITHUB_OUTPUT"
            echo "environment=production" >> "$GITHUB_OUTPUT" 
          else 
            echo "services=${CHANGES}"  >> "$GITHUB_OUTPUT"
            echo "environment=staging" >> "$GITHUB_OUTPUT"
            echo $CHANGES
          fi

  build-push-container-images:
    runs-on: ubuntu-24.04
    if: ${{ needs.filters.outputs.services != '[]' && needs.filters.outputs.services != ''}}
    needs: filters
    strategy:
      fail-fast: false
      matrix:
        services: ${{ fromJSON(needs.filters.outputs.services) }}
    steps:
      - name: checkout code
        uses: actions/checkout@d632683dd7b4114ad314bca15554477dd762a938
        with:
          fetch-depth: 0

      - name: Install task
        uses: ./.github/ractions/setup-dependencies

      # - name: Auth to DockerHub
      #   if: ${{ !env.ACT }}
      #   uses: docker/login-action@184bdaa0721073962dff0199f1fb9940f07167d1
      #   with:
      #     username: ${{ vars.DOCKERHUB_USERNAME }}
      #     password: ${{ secrets.DOCKERHUB_TOKEN }}

      # - name: Set up QEMU
      #   uses: docker/setup-qemu-action@29109295f81e9208d7d86ff1c6c12d2833863392

      # - name: Set up Docker Buildx
      #   uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435

      - name: Compute image tag
        id: image-tag
        working-directory: ${{matrix.services}}
        env:
          ENVIRONMENT: ${{needs.filters.outputs.environment}}
          SERVICES: ${{matrix.services}}
          INPUT_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || ''}}
        run: |
          if [[ -n $INPUT_VERSION ]]; then
             version=$INPUT_VERSION
             image_tag=$(task utils:manual-version-tag -- $INPUT_VERSION)
          elif [[ "$ENVIRONMENT" == "production" ]]; then
            version=$(task utils:generate-version -- "$SERVICES")
            image_tag=$(task utils:generate-version-tag -- "$SERVICES")
          else
            version=$(task utils:generate-extended-version -- "$SERVICES")
            image_tag=$(task utils:generate-extended-version-tag -- "$SERVICES")
          fi

          echo "version=${version}" >> $GITHUB_OUTPUT
          echo "image_tag=${image_tag}" >> $GITHUB_OUTPUT
          echo "version=${version}"
          echo "image_tag=${image_tag}"

